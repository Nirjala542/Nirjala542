<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1600 400"
     width="1600"
     height="400"
     shape-rendering="crispEdges"
     text-rendering="geometricPrecision">

  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#0fd3ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#0fd3ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="-800 0"
        dur="10s"
        repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1600" height="400" fill="url(#grad)"/>

  <!-- Text -->
  <text x="50%" y="55%"
        text-anchor="middle"
        dominant-baseline="middle"
        font-family="Fira Code, monospace"
        font-size="96"
        fill="#ffffff">
    🌸 I am Nirjala 🌸
  </text>

</svg>
