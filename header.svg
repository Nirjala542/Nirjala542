<svg viewBox="0 0 900 220" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="waterFlow" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#0fd3ff"/>
      <stop offset="50%" stop-color="#3a7bd5"/>
      <stop offset="100%" stop-color="#0fd3ff"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="-900 0"
        dur="8s"
        repeatCount="indefinite"/>
    </linearGradient>

    <filter id="wave">
      <feTurbulence type="fractalNoise" baseFrequency="0.008" numOctaves="2">
        <animate attributeName="baseFrequency"
          dur="10s"
          values="0.008;0.015;0.008"
          repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="18"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#waterFlow)" filter="url(#wave)"/>

  <text x="50%" y="55%"
        text-anchor="middle"
        font-size="50"
        font-family="Fira Code, monospace"
        fill="white"
        filter="url(#glow)">
    🌸 I am Nirjala 🌸
  </text>
</svg>
